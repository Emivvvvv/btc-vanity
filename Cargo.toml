[package]
name = "btc-vanity"
version = "3.0.0"
authors = ["Emirhan TALA <tala.emirhan@gmail.com>"]
description = "Local Bitcoin, Ethereum, and Solana vanity address search with CPU and experimental GPU backends."
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/Emivvvvv/btc-vanity"
documentation = "https://docs.rs/btc-vanity/latest/btc_vanity/index.html"
keywords = ["bitcoin", "ethereum", "solana", "vanity", "address"]

[dependencies]
rand = "0.9.5"
bitcoin = { version = "0.32.5", features = ["rand-std"] }
thiserror = "2.0.11"
clap = "4.5.26"
regex = "1.11.1"
memx = "0.1.32"
num-bigint = { version = "0.4.6", optional = true }
pollster = { version = "0.3.0", optional = true }
wgpu = { version = "0.19.4", optional = true }
bytemuck = { version = "1.15.0", optional = true }
ark-secp256k1 = { version = "0.4.0", optional = true }
ark-ed25519 = { version = "0.4.0", optional = true }
ark-ff = { version = "0.4.0", optional = true }
ark-ec = { version = "0.4.0", optional = true }
minijinja = { version = "2.0.1", features = ["loader"], optional = true }

# Dependencies for Ethereum support
hex = { version = "0.4.3", optional = true }  # Make it optional
secp256k1 = { version = "0.30.0", features = ["rand"], optional = true }  # Make it optional
sha3 = { version = "0.12.0", optional = true }

# Dependencies for Solana support
solana-keypair = { version = "=3.1.2", optional = true }
bs58 = { version = "0.5.1", optional = true }

[features]
default = []
gpu = ["dep:ark-ec", "dep:ark-ed25519", "dep:ark-ff", "dep:ark-secp256k1", "dep:bytemuck", "dep:minijinja", "dep:num-bigint", "dep:pollster", "dep:wgpu"]

ethereum = ["hex", "secp256k1", "sha3"]
solana = ["solana-keypair", "bs58"]
all = ["solana", "ethereum", "gpu"]

[dev-dependencies]
tempfile = "3.6"
criterion = "0.5.1"

[[bench]]
name = "gpu_end_to_end"
harness = false
required-features = ["gpu"]

[[bench]]
name = "cpu_benchmarks"
harness = false

[[bench]]
name = "pattern_matching"
harness = false

[profile.test]
opt-level = 3

# The profile that 'cargo dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
