[package]
name = "btc-vanity"
version = "3.0.0"
authors = ["Emirhan TALA <tala.emirhan@gmail.com>"]
description = "A blazingly fast Bitcoin, Ethereum, and Solana vanity address generator."
edition = "2021"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/Emivvvvv/btc-vanity"
documentation = "https://docs.rs/btc-vanity/latest/btc_vanity/index.html"
keywords = ["bitcoin", "ethereum", "solana", "vanity", "address"]

[dependencies]
rand = "0.9.0-beta.3"
bitcoin = { version = "0.32.5", features = ["rand-std"] }
thiserror = "2.0.11"
clap = "4.5.26"
num-traits = "0.2.19"
regex = "1.11.1"
memx = "0.1.32"
num-bigint = { version = "0.4.6", optional = true }
pollster = { version = "0.3.0", optional = true }
wgpu = { version = "0.19.4", optional = true }
multiprecision = { git = "https://github.com/geometers/multiprecision.git", optional = true }
bytemuck = { version = "1.15.0", optional = true }
futures-intrusive = { version = "0.5.0", optional = true }
ark-secp256k1 = { version = "0.4.0", optional = true }
ark-secp256r1 = { version = "0.4.0", optional = true }
ark-ed25519 = { version = "0.4.0", optional = true }
ark-ff = { version = "0.4.0", optional = true }
ark-ec = { version = "0.4.0", optional = true }
minijinja = { version = "2.0.1", features = ["loader"], optional = true }

# Dependencies for Ethereum support
hex = { version = "0.4.3", optional = true }  # Make it optional
secp256k1 = { version = "0.30.0", features = ["rand"], optional = true }  # Make it optional
sha3 = { version = "0.11.0-pre.4", optional = true }  # Make it optional

# Dependencies for Solana support
solana-sdk = { version = "2.1.10", default-features = false, features = ["full"], optional = true }
openssl = { version = "0.10", features = ["vendored"], optional = true }
aho-corasick = "1.1.3"

[features]
default = []
gpu = ["dep:ark-ec", "dep:ark-ed25519", "dep:ark-ff", "dep:ark-secp256k1", "dep:ark-secp256r1", "dep:bytemuck", "dep:futures-intrusive", "dep:minijinja", "dep:multiprecision", "dep:num-bigint", "dep:pollster", "dep:wgpu"]

ethereum = ["hex", "secp256k1", "sha3"]
solana = ["solana-sdk", "openssl"]
all = ["solana", "ethereum", "gpu"]

[dev-dependencies]
tempfile = "3.6"

[profile.test]
opt-level = 3

# The profile that 'cargo dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
